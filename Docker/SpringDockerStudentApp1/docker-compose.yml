

services:
  app:
    build: .
    ports:
      - "8080:8080"
    networks:
      - s-network


  postgres:
    image: postgres:latest
    container_name: shop-postgres
    environment:
      POSTGRES_DB: Demo
      POSTGRES_USER: alex
      POSTGRES_PASSWORD: 1234
    ports:
      - "5432:5432"
    networks:
      - s-network
    volumes:
      - postgres-s-data:/var/lib/postgresql

networks:
  s-network:
    driver: bridge


volumes:
  postgres-s-data:
